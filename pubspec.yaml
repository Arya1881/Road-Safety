name: road_guardian
description: RoadGuardian AI - Advanced Road Safety Monitoring Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  
  # Google Maps
  google_maps_flutter: ^2.5.0
  google_maps_webservice: ^4.0.0
  
  # Location & GPS
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  
  # Camera
  camera: ^0.10.5+2
  
  # ML Kit
  google_mlkit_face_detection: ^0.5.0
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^12.0.0
  
  # Utils
  intl: ^0.19.0
  http: ^1.1.0
  uuid: ^4.0.0
  
  # TTS
  flutter_tts: ^0.14.0
  
  # Sensors
  sensors_plus: ^2.1.0
  
  # Connectivity
  connectivity_plus: ^5.0.1
  
  # Notifications
  flutter_local_notifications: ^16.2.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
